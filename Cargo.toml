[workspace]
resolver = "2"

members = [
    "crates/deduced-core",
    "crates/deduced-gameplay",
    "crates/deduced-content",
    "crates/deduced-save",
    "crates/deduced-bot",
    "crates/deduced-protocol",
    "apps/deduced-cli",
    "apps/deduced-game",
    "apps/deduced-web",
    "apps/deduced-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = ""

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
thiserror = "2"
