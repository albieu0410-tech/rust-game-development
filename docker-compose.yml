services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: deduced
      POSTGRES_PASSWORD: deduced
      POSTGRES_DB: deduced
    ports:
      - "5432:5432"
    volumes:
      - deduced_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deduced"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  deduced_postgres_data:
